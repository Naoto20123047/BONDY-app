name = "bondy-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 秘匿情報はここに書かない。すべて wrangler secret put で設定する。
#   npx wrangler secret put TEAMS_WEBHOOK_URL
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
#   npx wrangler secret put IMAGE_SIGNING_KEY      … 画像URLの署名鍵(長いランダム文字列)
[vars]
FIREBASE_PROJECT_ID = "bondy-app-66ca4"

# CORS を許可するオリジン(カンマ区切り)。開発時の Vite も含めてある。
ALLOWED_ORIGINS = "https://bondy-app-66ca4.web.app,https://bondy-app-66ca4.firebaseapp.com,http://localhost:5173"

# Teams の通知に載せるアプリのURL(v1.3.2)。
# 以前はアプリが送ってきた本文をそのまま流していたが、今は Worker が文面を組み立てる
APP_ORIGIN = "https://bondy-app-66ca4.web.app"

# 紹介ページの写真の置き場所。
#
# Google Drive はサービスアカウントに保存容量が無く(403 storageQuotaExceeded)、
# 回避策の共有ドライブと OAuth 委任はどちらも Google Workspace 契約が要るため使えない。
# KV は Workers の無料枠(1GB / 読み取り10万回・書き込み1000回 per day)に含まれる。
#
# 作り方:
#   npx wrangler kv namespace create IMAGES
# 表示された id を下の行に貼る。この id は認証情報ではないので公開リポジトリに入れてよい。
[[kv_namespaces]]
binding = "IMAGES"
id = "e802545673bd4c9393423edde9505f2e"

[observability]
enabled = true

# 呼び出した人ごとの回数の制限(v1.4.1)。
# Teams への通知と紹介画像のアップロードは KV の書き込み(無料枠で1日1,000回)を使うため、
# 部員1人が呼び続けてその日の分を使い切らないようにする。
# period は 10 か 60(秒)しか選べない。namespace_id はアカウント内で重ならない数字なら何でもよい
[[ratelimits]]
name = "TEAMS_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# 定期バックアップ(v1.4.1)。毎週月曜 3:00(日本時間)= 日曜 18:00(UTC)。
# BACKUP_SERVICE_ACCOUNT を設定するまでは、動いても何もしない(backup.ts)
[triggers]
crons = ["0 18 * * 0"]
